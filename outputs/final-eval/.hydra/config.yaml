model:
  name: baseline
  embedding_dim: 64
  dropout: 0.1
  encoder:
    name: cnn
    channels:
    - 16
    - 32
    - 64
data:
  name: manifest
  manifest: data/samples.jsonl
  train_split: train
  val_split: val_id
  test_split: test_id
spectral:
  objective: none
task: train
seed: 17
deterministic: true
device: auto
threads: 1
epochs: 10
resume: null
pretrained_reference: null
checkpoint: outputs/final-sweep/1/best.pt
input: null
eval_split: null
eval_manifest: null
views:
  global_size: 224
  local_size: 256
  patches: 1
loader:
  batch_size: 16
  workers: 0
optimizer:
  lr: 0.001
  weight_decay: 0.0001
  clip_grad: 5.0
loss:
  global_aux: 0.2
  local_aux: 0.1
selection:
  metric: macro_generator_auroc
  mode: max
  patience: 3
tracking:
  uri: null
  experiment: image-detector
