model:
  name: dual_resolution
  embedding_dim: 128
  dropout: 0.1
  freeze_global: false
  freeze_local: false
  global_encoder:
    name: resnet
    base_channels: 16
    blocks:
    - 1
    - 1
    - 1
    preserve_detail: false
  local_encoder:
    name: resnet
    base_channels: 16
    blocks:
    - 1
    - 1
    - 1
    preserve_detail: true
data:
  name: synthetic
  train_split: train
  val_split: val_id
  test_split: test_id
  train_samples: 12
  val_samples: 8
  test_samples: 8
  image_size: 48
spectral:
  objective: none
task: train
seed: 17
deterministic: true
device: cpu
threads: 1
epochs: 1
resume: null
pretrained_reference: null
checkpoint: null
input: null
eval_split: null
eval_manifest: null
views:
  global_size: 32
  local_size: 32
  patches: 1
loader:
  batch_size: 4
  workers: 0
optimizer:
  lr: 0.001
  weight_decay: 0.0001
  clip_grad: 5.0
loss:
  global_aux: 0.2
  local_aux: 0.1
selection:
  metric: macro_generator_auroc
  mode: max
  patience: 3
tracking:
  uri: null
  experiment: image-detector-smoke
