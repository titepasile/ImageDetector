hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: outputs/final-sweep
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.sweep.dir=outputs/final-sweep
    - hydra.mode=MULTIRUN
    task:
    - experiment=smoke
    - model=baseline,dual_resolution
    - seed=17
    - epochs=1
  job:
    name: train
    chdir: false
    override_dirname: epochs=1,experiment=smoke,model=baseline,dual_resolution,seed=17
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/mischa/projects/image_detector
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/mischa/projects/image_detector/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      experiment: smoke
      spectral: none
      data: synthetic
      model: baseline
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
model:
  name: baseline
  embedding_dim: 64
  dropout: 0.1
  encoder:
    name: cnn
    channels:
    - 16
    - 32
    - 64
data:
  name: synthetic
  train_split: train
  val_split: val_id
  test_split: test_id
  train_samples: 12
  val_samples: 8
  test_samples: 8
  image_size: 48
spectral:
  objective: none
task: train
seed: 17
deterministic: true
device: cpu
threads: 1
epochs: 1
resume: null
pretrained_reference: null
checkpoint: null
input: null
eval_split: null
eval_manifest: null
views:
  global_size: 32
  local_size: 32
  patches: 1
loader:
  batch_size: 4
  workers: 0
optimizer:
  lr: 0.001
  weight_decay: 0.0001
  clip_grad: 5.0
loss:
  global_aux: 0.2
  local_aux: 0.1
selection:
  metric: macro_generator_auroc
  mode: max
  patience: 3
tracking:
  uri: null
  experiment: image-detector-smoke
